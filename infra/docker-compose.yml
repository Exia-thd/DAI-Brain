# Local DAI Brain. `docker compose up` from this directory.
#
# The Gateway is the only service with a published port. Core and MCP are
# reachable on the internal network and nowhere else, which is the deployment
# shape the scope model assumes: Core trusts the X-Scope header completely, and
# that trust is only sound while the Gateway is the only thing that can set it.

name: dai-brain

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-daibrain}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # Published for psql and the eval harness. Drop this line in any
      # deployment where the database should not be reachable from the host.
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-daibrain}"]
      interval: 5s
      timeout: 5s
      retries: 20

  core:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    command: ["node", "core/dist/server-cli.js"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-daibrain}
      CORE_PORT: "8081"
      DAI_EMBEDDING_PROVIDER: ${DAI_EMBEDDING_PROVIDER:-hash}
      DAI_EMBEDDING_DIMS: ${DAI_EMBEDDING_DIMS:-384}
      DAI_SEARCH_MAX_TOKENS: ${DAI_SEARCH_MAX_TOKENS:-1500}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8081/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10

  mcp:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    command: ["node", "mcp/dist/server-cli.js"]
    environment:
      MCP_PORT: "8082"
      CORE_URL: http://core:8081
    depends_on:
      core:
        condition: service_healthy

  gateway:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    command: ["node", "gateway/dist/server-cli.js"]
    environment:
      GATEWAY_PORT: "8080"
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-daibrain}
      CORE_URL: http://core:8081
      MCP_URL: http://mcp:8082/mcp
      GATEWAY_JWT_SECRET: ${GATEWAY_JWT_SECRET:-}
      GATEWAY_DEV_SCOPE: ${GATEWAY_DEV_SCOPE:-}
      GATEWAY_MAX_CONCURRENCY: ${GATEWAY_MAX_CONCURRENCY:-8}
      GATEWAY_WRITEBACK: ${GATEWAY_WRITEBACK:-true}
      # The CLI runs on an API key rather than a personal subscription login:
      # this process serves whoever holds a token, and a subscription is issued
      # to a person. Check Anthropic's terms for your own case.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      CLAUDE_MODEL: ${CLAUDE_MODEL:-}
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    depends_on:
      core:
        condition: service_healthy

volumes:
  pgdata:
