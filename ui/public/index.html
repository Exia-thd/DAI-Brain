<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>DAI Brain</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧠</text></svg>">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div id="app">
  <div id="scrim" class="scrim" hidden></div>

  <aside class="sidebar">
    <header class="brand">
      <div class="brand-mark">
        <span class="logo">🧠</span>
        <h1>DAI Brain</h1>
      </div>
      <button id="new-chat" class="new-chat" title="New conversation">
        <span class="plus">+</span> New chat
      </button>
    </header>

    <nav class="tabs">
      <button class="tab active" data-view="chat">Chat</button>
      <button class="tab" data-view="memory">Memory</button>
    </nav>

    <div class="list-label">Recent</div>
    <div id="conversation-list" class="conversations"></div>

    <footer class="status">
      <span class="dot" id="health-dot"></span>
      <span id="health">connecting…</span>
    </footer>
  </aside>

  <main id="view-chat" class="view active">
    <header class="topbar">
      <button id="sidebar-toggle" class="icon-btn" title="Conversations" aria-label="Conversations">☰</button>
      <div id="chat-title" class="topbar-title">New conversation</div>
      <button id="theme-toggle" class="icon-btn" title="Switch theme" aria-label="Switch theme"></button>
    </header>

    <div id="messages" class="messages">
      <div class="empty">
        <div class="empty-logo">🧠</div>
        <h2>What can I help you with?</h2>
        <p>Answers are grounded in what you have told DAI Brain before. Citations show which memories were used.</p>
      </div>
    </div>

    <form id="composer" class="composer">
      <div class="composer-box">
        <textarea id="input" rows="1" placeholder="Ask anything…"></textarea>
        <div class="composer-bar">
          <span class="hint">Enter to send · Shift+Enter for a newline</span>
          <button id="cancel" type="button" class="stop" hidden>■ Stop</button>
          <button id="send" type="submit" class="send" title="Send" aria-label="Send">↑</button>
        </div>
      </div>
    </form>
  </main>

  <main id="view-memory" class="view">
    <header class="topbar">
      <button class="icon-btn sidebar-toggle" title="Conversations" aria-label="Conversations">☰</button>
      <div class="topbar-title">Memory</div>
    </header>
    <div class="memory-toolbar">
      <input id="memory-query" type="search" placeholder="Search memory…">
      <select id="memory-type">
        <option value="">all types</option>
        <option value="decision">decision</option>
        <option value="fact">fact</option>
        <option value="preference">preference</option>
        <option value="procedure">procedure</option>
        <option value="note">note</option>
        <option value="artifact">artifact</option>
      </select>
      <label class="check"><input id="memory-superseded" type="checkbox"> show superseded</label>
      <button id="memory-refresh" class="ghost">Refresh</button>
    </div>
    <div id="fusion-report" class="fusion" hidden></div>
    <div id="memory-list" class="memory-list"></div>
  </main>

  <aside id="detail" class="detail" hidden>
    <header>
      <h3 id="detail-title">Memory</h3>
      <button id="detail-close" class="icon-btn" title="Close">×</button>
    </header>
    <div id="detail-body"></div>
  </aside>
</div>
<script type="module" src="app.js"></script>
</body>
</html>
